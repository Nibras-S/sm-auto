# Local MongoDB as a single-node replica set.
# A replica set is REQUIRED for multi-document transactions (order + inventory
# reservation must be atomic — see docs/ARCHITECTURE.md Appendix A, fix #6).
# The healthcheck auto-initiates the replica set on first boot.
services:
  mongo:
    image: mongo:7
    container_name: sm-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - sm_mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  sm_mongo_data:
